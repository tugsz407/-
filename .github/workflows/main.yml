name: Build Hudalchiig Ol APK
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: android-actions/setup-android@v3
      - name: Build Everything
        run: ZIP=$(find . -maxdepth 1 -iname '*.zip' | head -n 1) && unzip -q "$ZIP" -d src && cd src/* && npm install && npm run build && ([ -d "android" ] || npx cap add android) && npx cap sync android && cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Save APK
        run: mkdir -p out && cp src/*/android/app/build/outputs/apk/debug/app-debug.apk out/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Hudalchiig-Ol-APK
          path: out/app-debug.apk
