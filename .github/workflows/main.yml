name: Build Hudalchiig Ol APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract project and build
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname '*.zip' | head -n 1)
          unzip -q "$ZIP_FILE" -d source
          cd source/*/
          npm install
          npm run build
          npx cap add android || true
          npx cap sync android

      - name: Build APK
        run: |
          cd source/*/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hudalchiig-Ol-APK
          path: source/*/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
