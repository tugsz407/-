name: Build Hudalchiig Ol APK
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: android-actions/setup-android@v3
      - name: Extract zip
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname '*.zip' | head -n 1)
          unzip -q "$ZIP_FILE" -d source
      - name: Build web app
        run: |
          cd source/*
          npm install
          npm run build
      - name: Add Capacitor Android & Sync
        run: |
          cd source/*
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
      - name: Build APK with Gradle
        run: |
          cd source/*/android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Prepare artifact
        run: |
          mkdir -p out
          cp source/*/android/app/build/outputs/apk/debug/app-debug.apk out/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Hudalchiig-Ol-APK
          path: out/app-debug.apk
